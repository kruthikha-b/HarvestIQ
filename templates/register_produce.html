{% extends "base.html" %}

{% block title %}Register Produce{% endblock %}

{% block content %}

<style>
    .produce-container {
        max-width: 850px;
        margin: 50px auto;
    }

    .produce-card {
        background: white;
        padding: 35px;
        border-radius: 20px;
        box-shadow: 0 5px 18px rgba(0, 0, 0, .08);
    }

    .produce-card h2 {
        color: #1d4d2b;
        text-align: center;
        margin-bottom: 30px;
        font-weight: bold;
    }

    .form-label {
        font-weight: 600;
    }

    .btn-save {
        background: #2e7d32;
        color: white;
    }

    .btn-save:hover {
        background: #1d4d2b;
        color: white;
    }
</style>

<div class="container produce-container">

    <div class="produce-card">

        <h2>🌾 Register Produce</h2>

        <form method="POST">

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="form-label">Crop Name</label>

                    <input type="text" name="crop_name" class="form-control" required>

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">Variety</label>

                    <input type="text" name="variety" class="form-control" required>

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">Quantity</label>

                    <input type="number" name="quantity" class="form-control" required>

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">Unit</label>

                    <select name="unit" class="form-select" required>

                        <option value="">Select Unit</option>
                        <option value="Kg">Kg</option>
                        <option value="Ton">Ton</option>
                        <option value="Boxes">Boxes</option>
                        <option value="Bags">Bags</option>

                    </select>

                </div>
                <div class="col-md-6 mb-3">

                    <label class="form-label">Harvest Date</label>

                    <input type="date" name="harvest_date" class="form-control" required>

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">Farm Location</label>

                    <input type="text" name="farm_location" class="form-control" placeholder="Village / Farm Address"
                        required>

                </div>

            </div>

            <div class="mt-4 text-center">

                <button type="submit" class="btn btn-save px-5">

                    Register Produce

                </button>

                <a href="{{ url_for('farmer_dashboard') }}" class="btn btn-secondary px-5 ms-2">

                    Cancel

                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
