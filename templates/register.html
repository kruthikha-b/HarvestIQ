{% extends "base.html" %}

{% block title %}Register{% endblock %}

{% block content %}

<div class="container mt-5 mb-5" style="max-width:700px;">

<div class="card shadow p-4">

<h2 class="text-center text-success mb-4">
Create Account
</h2>

<form method="POST">

<div class="mb-3">
<label>Full Name</label>
<input type="text" name="full_name" class="form-control" required>
</div>

<div class="mb-3">
<label>Email</label>
<input type="email" name="email" class="form-control" required>
</div>

<div class="mb-3">
<label>Phone</label>
<input type="text" name="phone" class="form-control" required>
</div>

<div class="mb-3">
<label>Password</label>
<input type="password" name="password" class="form-control" required>
</div>

<div class="mb-3">

<label>Role</label>

<select class="form-select" name="role" id="role" onchange="showFields()">

<option value="Farmer">Farmer</option>

<option value="Buyer">Buyer</option>

<option value="Logistics">Logistics</option>

</select>

</div>

<!-- Farmer Fields -->

<div id="farmer">

<div class="mb-3">
<label>State</label>
<input type="text" name="state" class="form-control">
</div>

<div class="mb-3">
<label>District</label>
<input type="text" name="district" class="form-control">
</div>

<div class="mb-3">
<label>Land Size (Acres)</label>
<input type="number" step="0.1" name="land_size" class="form-control">
</div>

<div class="mb-3">
<label>Farmer Type</label>
<input type="text" name="farmer_type" class="form-control">
</div>

<div class="form-check mb-3">
<input class="form-check-input" type="checkbox" name="fpo_member">
<label class="form-check-label">
FPO Member
</label>
</div>

<div class="mb-3">
<label>Income Category</label>
<input type="text" name="income_category" class="form-control">
</div>

</div>

<!-- Buyer Fields -->

<div id="buyer" style="display:none;">

<div class="mb-3">
<label>Company Name</label>
<input type="text" name="company_name" class="form-control">
</div>

<div class="mb-3">
<label>Buyer Type</label>
<input type="text" name="buyer_type" class="form-control">
</div>

<div class="mb-3">
<label>City</label>
<input type="text" name="city" class="form-control">
</div>

</div>

<!-- Logistics -->

<div id="logistics" style="display:none;">

<div class="mb-3">
<label>Company Name</label>
<input type="text" name="company_name" class="form-control">
</div>

</div>

<div class="text-center">

<button class="btn btn-success px-5">

Register

</button>

</div>

</form>

</div>

</div>

<script>

function showFields(){

let role=document.getElementById("role").value;

document.getElementById("farmer").style.display="none";
document.getElementById("buyer").style.display="none";
document.getElementById("logistics").style.display="none";

if(role=="Farmer")
document.getElementById("farmer").style.display="block";

if(role=="Buyer")
document.getElementById("buyer").style.display="block";

if(role=="Logistics")
document.getElementById("logistics").style.display="block";

}

</script>

{% endblock %}
