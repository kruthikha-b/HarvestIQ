{% extends "base.html" %}

{% block title %}Edit Delivery{% endblock %}

{% block content %}

<style>
    .dashboard {
        background: #f5f7f2;
        min-height: 100vh;
        padding: 40px 0;
    }

    .card {
        border: none;
        border-radius: 15px;
        box-shadow: 0 2px 10px rgba(0, 0, 0, .08);
    }

    .card-header {
        background: #1d4d2b;
        color: white;
        font-size: 22px;
        font-weight: bold;
    }

    label {
        font-weight: 600;
    }

    .btn-success {
        background: #1d4d2b;
        border: none;
    }

    .btn-success:hover {
        background: #163a20;
    }
</style>

<div class="dashboard">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-8">

                <div class="card">

                    <div class="card-header">

                        ✏️ Edit Delivery

                    </div>

                    <div class="card-body">

                        <form method="POST">

                            <div class="mb-3">

                                <label>Source</label>

                                <input type="text" name="source" class="form-control" value="{{ delivery.source }}"
                                    required>

                            </div>

                            <div class="mb-3">

                                <label>Destination</label>

                                <input type="text" name="destination" class="form-control"
                                    value="{{ delivery.destination }}" required>

                            </div>

                            <div class="mb-3">

                                <label>Transport Temperature (°C)</label>

                                <input type="number" step="0.1" name="transport_temperature" class="form-control"
                                    value="{{ delivery.transport_temperature }}" required>

                            </div>

                            <div class="mb-3">

                                <label>Status</label>

                                <select name="status" class="form-select">

                                    <option value="Registered" {% if delivery.status=="Registered" %}selected{% endif
                                        %}>
                                        Registered
                                    </option>

                                    <option value="In Transit" {% if delivery.status=="In Transit" %}selected{% endif
                                        %}>
                                        In Transit
                                    </option>

                                    <option value="Delivered" {% if delivery.status=="Delivered" %}selected{% endif %}>
                                        Delivered
                                    </option>

                                    <option value="Delayed" {% if delivery.status=="Delayed" %}selected{% endif %}>
                                        Delayed
                                    </option>

                                </select>

                            </div>

                            <div class="mb-3">

                                <label>ETA</label>

                                <input type="datetime-local" name="eta" class="form-control"
                                    value="{{ delivery.eta.strftime('%Y-%m-%dT%H:%M') if delivery.eta else '' }}">

                            </div>

                            <div class="text-center">

                                <button type="submit" class="btn btn-success px-5">

                                    Update Delivery

                                </button>

                                <a href="{{ url_for('manage_deliveries') }}" class="btn btn-secondary px-5">

                                    Cancel

                                </a>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
