{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

    <div class="card p-4">

        <h3>Buy Produce</h3>

        <hr>

        <p><b>Crop:</b> {{ batch.crop_name }}</p>

        <p><b>Available Quantity:</b> {{ batch.quantity }}</p>

        <form method="POST">

            <label>Quantity</label>

            <input
                type="number"
                name="quantity"
                class="form-control"
                required
            >

            <br>

            <label>Total Price</label>

            <input
                type="number"
                step="0.01"
                name="sale_price"
                class="form-control"
                required
            >

            <br>

            <button class="btn btn-success">
                Confirm Purchase
            </button>

        </form>

    </div>

</div>

{% endblock %}
