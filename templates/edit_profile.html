{% extends "base.html" %}

{% block title %}Edit Profile{% endblock %}

{% block content %}

<style>
    .edit-profile {
        max-width: 850px;
        margin: 50px auto;
    }

    .edit-card {
        background: white;
        padding: 35px;
        border-radius: 20px;
        box-shadow: 0 5px 18px rgba(0, 0, 0, .08);
    }

    .edit-card h2 {
        text-align: center;
        color: #1d4d2b;
        margin-bottom: 30px;
        font-weight: bold;
    }

    .form-label {
        font-weight: 600;
    }
</style>

<div class="container edit-profile">

    <div class="edit-card">

        <h2>👤 Edit Profile</h2>

        <form method="POST">

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Full Name
                    </label>

                    <input type="text" name="full_name" class="form-control" value="{{ user.full_name }}" required>

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Phone
                    </label>

                    <input type="text" name="phone" class="form-control" value="{{ user.phone }}" required>

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        State
                    </label>

                    <input type="text" name="state" class="form-control" value="{{ farmer.state }}" required>

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        District
                    </label>

                    <input type="text" name="district" class="form-control" value="{{ farmer.district }}" required>

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Land Size (Acres)
                    </label>

                    <input type="number" step="0.1" name="land_size" class="form-control" value="{{ farmer.land_size }}"
                        required>

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Farmer Type
                    </label>

                    <select name="farmer_type" class="form-select">
                        <option value="Small" {% if farmer.farmer_type=="Small" %}selected{% endif %}>
                            Small
                        </option>

                        <option value="Medium" {% if farmer.farmer_type=="Medium" %}selected{% endif %}>
                            Medium
                        </option>

                        <option value="Large" {% if farmer.farmer_type=="Large" %}selected{% endif %}>
                            Large
                        </option>

                    </select>

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Income Category
                    </label>

                    <select name="income_category" class="form-select">

                        <option value="Low" {% if farmer.income_category=="Low" %}selected{% endif %}>
                            Low
                        </option>

                        <option value="Middle" {% if farmer.income_category=="Middle" %}selected{% endif %}>
                            Middle
                        </option>

                        <option value="High" {% if farmer.income_category=="High" %}selected{% endif %}>
                            High
                        </option>

                    </select>

                </div>

                <div class="col-md-6 mb-4">

                    <div class="form-check mt-4">

                        <input class="form-check-input" type="checkbox" name="fpo_member" id="fpo_member" {% if
                            farmer.fpo_member %}checked{% endif %}>

                        <label class="form-check-label" for="fpo_member">

                            FPO Member

                        </label>

                    </div>

                </div>

            </div>

            <div class="text-center mt-4">

                <button type="submit" class="btn btn-success px-5">

                    Save Changes

                </button>

                <a href="{{ url_for('profile') }}" class="btn btn-secondary px-5 ms-2">

                    Cancel

                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
