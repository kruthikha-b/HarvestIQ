{% extends "base.html" %}

{% block title %}Logistics Profile{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="card shadow p-4">

        <h2 class="text-success mb-4">
            Logistics Profile
        </h2>

        <form method="POST" action="{{ url_for('update_logistics_profile') }}">

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="form-label">Full Name</label>

                    <input
                        type="text"
                        name="full_name"
                        class="form-control"
                        value="{{ user.full_name }}"
                        required
                    >

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">Email</label>

                    <input
                        type="email"
                        name="email"
                        class="form-control"
                        value="{{ user.email }}"
                        required
                    >

                </div>

            </div>

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="form-label">Phone</label>

                    <input
                        type="text"
                        name="phone"
                        class="form-control"
                        value="{{ user.phone }}"
                    >

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">Company Name</label>

                    <input
                        type="text"
                        name="company_name"
                        class="form-control"
                        value="{{ logistics.company_name }}"
                    >

                </div>

            </div>

            <button class="btn btn-success">
                Update Profile
            </button>

        </form>

    </div>

</div>

{% endblock %}
