{% extends "base.html" %}

{% block title %}Confirm Sale{% endblock %}

{% block content %}

<style>
    .sale-container {
        max-width: 850px;
        margin: 50px auto;
    }

    .sale-card {
        background: white;
        padding: 35px;
        border-radius: 20px;
        box-shadow: 0 5px 18px rgba(0, 0, 0, .08);
    }

    .sale-card h2 {
        text-align: center;
        color: #1d4d2b;
        margin-bottom: 30px;
        font-weight: bold;
    }
</style>

<div class="container sale-container">

    <div class="sale-card">

        <h2>💰 Confirm Produce Sale</h2>

        <form method="POST">

            <div class="mb-3">

                <label class="form-label">

                    Select Buyer

                </label>

                <select name="buyer_id" class="form-select" required>

                    {% for buyer in buyers %}

                    <option value="{{ buyer.id }}">

                        {{ buyer.company_name }}

                    </option>

                    {% endfor %}

                </select>

            </div>

            <div class="mb-3">

                <label class="form-label">

                    Selling Price

                </label>

                <input type="text" class="form-control" value="₹ {{ recommendation.estimated_price }}" readonly>

            </div>

            <div class="mb-3">

                <label class="form-label">

                    Quantity

                </label>

                <input type="text" class="form-control" value="{{ batch.quantity }} {{ batch.unit }}" readonly>

            </div>
            <div class="text-center mt-4">

                <button type="submit" class="btn btn-success px-5">

                    💰 Confirm Sale

                </button>

                <a href="{{ url_for('buyer_recommendation', batch_id=batch.id) }}" class="btn btn-secondary px-5 ms-2">

                    Cancel

                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
